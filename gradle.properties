org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base package used by convention plugins to derive each module's namespace.
app.package=com.machinarium.notesv2

# API configuration per environment flavor (ENV-01). Real/secret values belong in ~/.gradle/gradle.properties or CI.
api.stage.baseUrl=https://jsonplaceholder.typicode.com/
api.prod.baseUrl=https://jsonplaceholder.typicode.com/
# Comma-separated sha256/... pins (current intermediate + root, plus backup roots — HARD-01). Empty = pinning off.
# jsonplaceholder.typicode.com, read 2026-10-08: WE1 intermediate + GTS Root R4 (live chain), backups GTS Root R1 + ISRG Root X1 (system trust store).
api.stage.certPins=sha256/kIdp6NNEd8wsugYyyIYFsi1ylMCED3hZbSR8ZFsa/A4=,sha256/mEflZT5enoR1FuXLgYYGqnVEoZvmf9c2bVBpiOjYQ0c=,sha256/hxqRlPTu1bMS/0DITB1SSu0vd4u/8l8TjPgfaAp63Gc=,sha256/C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=
api.prod.certPins=sha256/kIdp6NNEd8wsugYyyIYFsi1ylMCED3hZbSR8ZFsa/A4=,sha256/mEflZT5enoR1FuXLgYYGqnVEoZvmf9c2bVBpiOjYQ0c=,sha256/hxqRlPTu1bMS/0DITB1SSu0vd4u/8l8TjPgfaAp63Gc=,sha256/C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=

# Analytics keys (real values in ~/.gradle/gradle.properties or CI). Blank = that provider stays off.
analytics.adjust.appToken=
# name:token pairs, e.g. note_opened:abc123,note_created:def456
analytics.adjust.eventTokens=
analytics.appsflyer.devKey=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# CI: setup-java exposes extra JDKs only as JAVA_HOME_<v>_<arch>; let Gradle find the Java 17 daemon JDK there.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_X64,JAVA_HOME_21_ARM64
